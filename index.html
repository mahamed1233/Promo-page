        * {

        .landing-card {

            border-radius: 24px;

        }

        .badge {

            font-size: 12px;

            margin-bottom: 16px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .promo-container {
            background: rgba(15, 23, 42, 0.6);
            border: 2px dashed rgba(59, 130, 246, 0.4);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            transition: border-color 0.3s;
        }

        .promo-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .promo-code {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-green);
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .copy-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }

        .copy-btn:hover {
            background: var(--btn-hover);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .download-btn {
            display: block;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 18px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(59, 130, 246, 0.3);
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 24px;
        }

        .feature-card {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .feature-icon {
            font-size: 18px;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
